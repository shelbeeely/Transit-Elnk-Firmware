; Transit-Elnk-Firmware — PlatformIO project
;
; Built on the FreeInk SDK (https://github.com/Free-Ink/freeink-sdk, vendored
; as a git submodule at freeink-sdk/). [base]/[env:xteink_x4] are adapted from
; the SDK's own platformio.sample.ini, cross-checked against two real
; consumers (crosspoint-reader, InkPointX) which build this exact
; board/flags/lib_deps pattern green in CI.
;
; Fresh checkout: run `git submodule update --init --recursive` before `pio run`.

[base]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the controller's RAM holds the previous frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  ; BLE keyboard host, used by the first-run setup flow for Wi-Fi/API-key/
  ; stop-search text entry (the X4 has no touch or built-in keyboard).
  -DFREEINK_CAP_BLE_HID_HOST=1

build_unflags =
  -std=gnu++11

; The Xteink X4 module is wired for DIO / 16 MB.
board_build.flash_mode = dio
board_build.flash_size = 16MB

; FreeInk libraries actually used by this firmware. Left-hand names are what
; the code includes (<EInkDisplay.h>, <BoardConfig.h>, ...).
;
; NOT included: SecureNet (wolfSSL TLS 1.3) — it's an opt-in heavyweight
; transport meant for TLS-1.3-only servers; external.transitapp.com is a
; standard REST API and works fine over the Arduino core's own
; WiFiClientSecure/HTTPClient, so the API client uses those directly instead
; (see src/transit/api_client.cpp). Add SecureNet back only if that proves
; insufficient.
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  MemoryManager=symlink://freeink-sdk/libs/hardware/MemoryManager
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  h2zero/NimBLE-Arduino @ ^2.3.8
  bblanchon/ArduinoJson @ ^7.4.2

; --- Xteink X4 only — ESP32-C3, SSD1677 800x480 -------------------------------
[env:xteink_x4]
extends = base
board = esp32-c3-devkitm-1
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1

; --- Host-side tests — hardware-independent logic only, no FreeInk/ESP32 -----
; Covers models (JSON parsing), ui_logic (filter/sort/dedupe/badges),
; config_store (against an in-memory backend), power_scheduler (interval math).
[env:native]
platform = native
build_flags =
  -std=gnu++17
  -DFREEINK_HOST_NATIVE=1
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
test_framework = unity
; Link the src/ modules under test (models.cpp, config_store.cpp, ui_logic.cpp,
; power_scheduler.cpp) into each test binary — otherwise `pio test` only
; builds test/ + lib/, and the module symbols under test are undefined.
test_build_src = true
; Only the hardware-independent modules compile here (see the
; FREEINK_HOST_NATIVE guard in power_scheduler.h/.cpp for the one module
; that's split pure-logic vs. hardware). The rest (render_engine, icon_cache,
; setup_flow, main.cpp) include FreeInk/BLE headers not present on native.
build_src_filter =
  +<*>
  -<main.cpp>
  -<transit/render_engine.cpp>
  -<transit/icon_cache.cpp>
  -<transit/setup_flow.cpp>
  -<transit/config_store_nvs.cpp>
  -<transit/http_transport.cpp>
