name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-tests:
    name: Host-side tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run native test suite
        run: pio test -e native

  xteink-x4-build:
    name: Firmware build (xteink_x4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e xteink_x4
