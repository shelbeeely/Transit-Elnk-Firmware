name: CI

on:
  push:
    # claude/** as well as main: development happens on those branches, and
    # the xteink_x4 cross-compile is the one check that cannot be run
    # anywhere else -- a sandbox has no ESP32 toolchain, so a push that only
    # landed on a feature branch used to go completely unverified until it
    # reached main. Catching a build break here costs one CI run; catching
    # it after a merge costs a broken main.
    branches: [main, 'claude/**']
  pull_request:

jobs:
  native-tests:
    name: Host-side tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run native test suite
        run: pio test -e native

  xteink-x4-build:
    name: Firmware build (xteink_x4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e xteink_x4
