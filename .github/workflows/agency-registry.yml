name: Agency registry

# Validates agencies/registry.json on every PR that touches it -- catches a
# malformed or incomplete entry (a status=supported agency missing its
# gtfs_rt block, a duplicate id, a plain-http URL, an unfilled placeholder
# auth value) before it's merged, rather than when someone tries to build a
# pack from it later. See docs/AGENCY_REGISTRY.md for what this registry is
# (and isn't) and tools/validate_agency_registry.py for exactly what's
# checked -- deliberately schema-plus-shape only, no outbound requests to
# agency servers, so a third party having a bad minute can't fail an
# unrelated contributor's CI.
#
# Also checks include/transit/agency_metadata.h + src/transit/
# agency_metadata.cpp (the settings portal's on-device copy of each
# supported agency's name/attribution/terms) are what
# tools/gen_agency_metadata.py would produce from the registry as committed
# -- catches a registry edit whose generated files weren't regenerated to
# match, the same class of drift docs/STA_INTEGRATION.md's own weekly
# workflow guards against for STA's tables.

on:
  pull_request:
    paths:
      - "agencies/**"
      - "tools/validate_agency_registry.py"
      - "tools/gen_agency_metadata.py"
      - "include/transit/agency_metadata.h"
      - "src/transit/agency_metadata.cpp"
      - ".github/workflows/agency-registry.yml"
  push:
    branches: [main]
    paths:
      - "agencies/**"
      - "tools/validate_agency_registry.py"
      - "tools/gen_agency_metadata.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install jsonschema

      - run: python3 tools/validate_agency_registry.py

      - name: Check agency_metadata.h/.cpp are up to date
        run: |
          set -euo pipefail
          python3 tools/gen_agency_metadata.py
          if ! git diff --exit-code -- include/transit/agency_metadata.h src/transit/agency_metadata.cpp; then
            echo "::error::agency_metadata.h/.cpp don't match agencies/registry.json -- run 'python3 tools/gen_agency_metadata.py' and commit the result" >&2
            exit 1
          fi
