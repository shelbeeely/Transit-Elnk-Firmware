name: Release firmware

# Publishes a firmware image and the manifest the board's OTA pull path
# reads (docs/OTA_UPDATES.md). Tag-driven, because a version is exactly what
# a tag is -- tools/pio_version.py runs `git describe` at build time, so the
# FREEINK_FW_VERSION baked into the image is the tag itself, and the
# manifest's "version" field can be compared against it directly.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Point a board's settings-portal manifest URL at
#   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
# and it picks up every subsequent release on its own.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # tools/pio_version.py runs `git describe --tags`, which needs the
          # tags and enough history to reach them; the default shallow
          # checkout has neither and would bake in a bare commit sha.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e xteink_x4

      - name: Assemble the release artifacts
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          cp .pio/build/xteink_x4/firmware.bin release/firmware.bin

          VERSION="${GITHUB_REF_NAME}"
          SHA256=$(sha256sum release/firmware.bin | cut -d' ' -f1)
          SIZE=$(stat -c%s release/firmware.bin)

          # The board refuses a manifest whose sha256 isn't 64 lowercase hex
          # characters, whose url isn't https, or whose size is missing --
          # see parseOtaManifest(). Generating all three here rather than by
          # hand is the point of this step.
          cat > release/manifest.json <<JSON
          {
            "version": "${VERSION}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/firmware.bin",
            "sha256": "${SHA256}",
            "size": ${SIZE},
            "notes": "Built from ${GITHUB_SHA}"
          }
          JSON

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

          # A build that outgrew its OTA slot cannot be installed over the
          # air at all, and failing here is far better than publishing a
          # release every board will reject one megabyte into the download.
          if [ "${SIZE}" -gt $((0x640000)) ]; then
            echo "firmware.bin is ${SIZE} bytes, larger than the 0x640000 OTA slot" >&2
            exit 1
          fi

      - name: Publish the browser-flashable build to the Pages site
        id: web_install
        # A from-scratch flash (as opposed to the OTA path above) needs the
        # bootloader and partition table too, not just the app image -- and
        # ESP Web Tools' <esp-web-install-button> fetches its manifest and
        # binaries with plain fetch(), which GitHub Release assets refuse
        # with CORS (verified against release-assets.githubusercontent.com:
        # no Access-Control-Allow-Origin header, even with an Origin sent).
        # Publishing into site/firmware/ instead makes the flash page and
        # the binaries it fetches same-origin, which sidesteps that
        # entirely -- the same approach web.esphome.io and Tasmota's own
        # installer use.
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          cp .pio/build/xteink_x4/bootloader.bin site/firmware/bootloader.bin
          cp .pio/build/xteink_x4/partitions.bin site/firmware/partitions.bin
          cp .pio/build/xteink_x4/firmware.bin site/firmware/firmware.bin

          VERSION="${GITHUB_REF_NAME}"
          cat > site/firmware/install-manifest.json <<JSON
          {
            "name": "Transit-Elnk-Firmware",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-C3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "firmware.bin", "offset": 65536 }
                ]
              }
            ]
          }
          JSON

      - name: Commit the browser-flashable build to main
        # release.yml runs on a tag ref (detached), but the Pages site is
        # built from main -- switch there before committing, same pattern
        # sta-timetable.yml uses for its own generated, bot-committed files.
        # This push also re-triggers pages.yml (it watches site/**), so the
        # flash page picks up the new build without a separate step here.
        run: |
          set -euo pipefail
          mkdir -p /tmp/web-install-stage
          cp site/firmware/*.bin site/firmware/install-manifest.json /tmp/web-install-stage/

          git fetch origin main
          git checkout main
          mkdir -p site/firmware
          cp /tmp/web-install-stage/* site/firmware/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/firmware/
          if git diff --cached --quiet; then
            echo "no change: site/firmware/ already matches this build"
          else
            git commit -m "Publish ${GITHUB_REF_NAME} to the browser flasher

          Built from ${GITHUB_SHA}. Picked up by the Pages site's
          site/flash.html via <esp-web-install-button>."
            git push origin HEAD:main
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            release/firmware.bin release/manifest.json \
            --title "${GITHUB_REF_NAME}" \
            --notes "Firmware \`${{ steps.artifacts.outputs.version }}\`, ${{ steps.artifacts.outputs.size }} bytes, sha256 \`${{ steps.artifacts.outputs.sha256 }}\`.

          First flash (no cable-and-PlatformIO setup needed): [flash it from your browser](https://shelbeeely.github.io/Transit-Elnk-Firmware/flash.html) over USB, Chrome or Edge only.

          Already on a board? Install over the air by pointing the board's manifest URL at:
          \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json\`

          Or upload \`firmware.bin\` directly from the settings portal's Firmware step. See [docs/OTA_UPDATES.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/OTA_UPDATES.md)."
